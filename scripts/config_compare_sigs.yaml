# Encoding/sketch directories to process.
# Each must contain BactMinhash_n{n}_k{k}/ and PhageMinhash_n{n}_k{k}/ subdirs.
sketch_dirs:
- /home/projects/s215045/PredictPhagePPI/data_prod/SM_sketches_allphages
- /home/projects/s215045/PredictPhagePPI/data_prod/encoded_sketches_allphages
# - /home/projects/s215045/PredictPhagePPI/data_prod/SM_sketches_data2_allphages
#- /home/projects/s215045/PredictPhagePPI/data_prod/encoded_sketches_data2_allphages

# Downsampling parameter sweep
# n_values: [50, 100, 300, 500, 1000, 5000]
# k_values: [6, 9, 12, 15, 18, 24, 32, 51]
n_values: [300, 500, 1000]
k_values: [9, 12, 15, 32]


# Bacteria genus-lookup CSV (produced externally; used for label prefixing)
