# ──────────────────────────────────────────────────────────────────────────────
# config.yaml  –  sourmash similarity pipeline
# ──────────────────────────────────────────────────────────────────────────────

# Encoding/sketch directories to process.
# Each must contain BactMinhash_n{n}_k{k}/ and PhageMinhash_n{n}_k{k}/ subdirs.
sketch_dirs:
#  - /home/projects/s215045/PredictPhagePPI/data_prod/SM_sketches
  - /home/projects/s215045/PredictPhagePPI/data_prod/encoded_sketches
#  - /home/projects/s215045/PredictPhagePPI/data_prod/SM_sketches_data2
#  - /home/projects/s215045/PredictPhagePPI/data_prod/encoded_sketches_data2 

# Downsampling parameter sweep
# n_values: [50, 100, 300, 500, 1000, 5000]
# k_values: [6, 9, 12, 15, 18, 24, 32, 51]
n_values: [500]
k_values: [24]


# Bacteria genus-lookup CSV (produced externally; used for label prefixing)
bact_labels_csv: /home/projects/s215045/PredictPhagePPI/data_prod/bact_clusters_with_genus.csv

# Shell script that prefixes bacteria labels with genus names
prefix_script: /home/projects/s215045/PredictPhagePPI/scripts/annotation_scripts/prefix_bact_labels.sh

# Dendrogram cut-points (passed to sourmash scripts plot2 --cut-point)
bact_cut_point:  1.35
phage_cut_point: 1.15

# Figure dimensions
figsize_x: 20
figsize_y: 18
